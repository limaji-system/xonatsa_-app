<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — Xona TSA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen login">
    <img class="corner-tl" src="corner-tl.png" alt="">
    <img class="corner-br" src="corner-br.png" alt="">

    <div class="content">
      <div class="logo-block">
        <img src="logo.png" alt="Xona TSA">
      </div>

      <h1 class="title">Connectez-vous</h1>
      <p class="subtitle">Accédez à votre compte pour gérer vos événements et vos tickets.</p>

      <form id="login-form" novalidate>
        <div class="tabs" data-tabs>
          <button type="button" class="tab active" data-target="login-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            E-mail
          </button>
          <button type="button" class="tab" data-target="login-phone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            Téléphone
          </button>
        </div>

        <div class="panel active" id="login-email">
          <div class="field-group">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              <input type="email" placeholder="Adresse e-mail" autocomplete="email" required>
            </div>
            <div class="field-error"></div>
          </div>
        </div>

        <div class="panel" id="login-phone">
          <div class="field-group">
            <div class="field">
              <div class="country-select">
                <select aria-label="Indicatif pays">
                  <option value="228">🇹🇬 +228</option>
                  <option value="229">🇧🇯 +229</option>
                  <option value="225">🇨🇮 +225</option>
                  <option value="233">🇬🇭 +233</option>
                  <option value="237">🇨🇲 +237</option>
                  <option value="221">🇸🇳 +221</option>
                </select>
              </div>
              <input type="tel" placeholder="Numéro de téléphone" autocomplete="tel">
            </div>
            <div class="field-error"></div>
          </div>
        </div>

        <div class="field-group">
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required>
            <button type="button" class="field-toggle" data-toggle="password" aria-label="Afficher le mot de passe">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
            </button>
          </div>
          <div class="field-error"></div>
        </div>

        <div class="row-between">
          <label class="checkbox-label">
            <input type="checkbox" checked>
            <span class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            Se souvenir de moi
          </label>
          <a class="link" href="#">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          Se connecter
        </button>

        <div class="divider">OU</div>

        <a href="signup.html" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11v6M19 14h6"/></svg>
          Créer un compte
        </a>
      </form>

      <div class="secure-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5Z"/></svg>
        Connexion sécurisée
      </div>

      <div class="brand-footer">by Trillion Software</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
