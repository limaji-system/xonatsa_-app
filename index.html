<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xona TSA</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  .splash {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;
  }
  .splash img {

    object-fit: contain;

    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>

    <img src="splash.png" alt="Xona TSA">

  <script src="app.js"></script>
